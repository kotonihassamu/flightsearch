name: daily-flight-check

# 要件4.1: JST 8:00 = UTC 23:00。GitHub Actions の cron は遅延を許容する仕様。
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "StubFetcher + コンソール通知で実行（外部接続なし）"
        type: boolean
        default: false

concurrency:
  group: daily-flight-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      TZ: Asia/Tokyo
      # 障害調査用の生HTML保存先（要件4.3）。失敗時にアーティファクトとして回収する。
      FLIGHTDEAL_ARTIFACT_DIR: artifacts
      # Windows以外でも日本語を確実に扱う
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 要件6: 外部接続を伴わないテストのみをCIの合否条件にする
      - name: Unit tests
        run: pytest -q

      - name: Prepare artifact dir
        run: mkdir -p artifacts

      - name: Run
        id: run
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m flightdeal.main --dry-run
          else
            python -m flightdeal.main
          fi

      # 要件4.3: 失敗時は調査用の生HTMLを7日間保持する
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
