name: daily-flight-check

# 1日2回、JST 7時前 と 19時前 に通知が届くようにする。
#
# cron は UTC。JST = UTC+9 なので:
#   06:15 JST = 21:15 UTC（前日）
#   18:15 JST = 09:15 UTC
#
# 【重要】GitHub Actions の cron は「その時刻以降に実行」であり、
# 混雑時は数十分〜1時間遅れることがある（公式仕様。特に毎時0分は混む）。
# そのため目標時刻の45分前に設定し、かつ :15 という半端な分にしてある。
# 「必ず7時までに」という保証は Actions では不可能なので、
# 確実性が要るならローカルのタスクスケジューラを使うこと。
on:
  schedule:
    - cron: "15 21 * * *"   # 06:15 JST → 7時前の通知
    - cron: "15 9 * * *"    # 18:15 JST → 19時前の通知
  workflow_dispatch:
    inputs:
      dry_run:
        description: "StubFetcher + コンソール通知で実行（外部接続なし）"
        type: boolean
        default: false

concurrency:
  group: daily-flight-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 20空港×2週末＝80検索。待機込みで実測15分前後を見込み、余裕をとって45分。
    # （GitHub Free の Actions 無料枠は private リポジトリで月2,000分）
    timeout-minutes: 45

    env:
      PYTHONPATH: src
      TZ: Asia/Tokyo
      # 障害調査用の生HTML保存先（要件4.3）。失敗時にアーティファクトとして回収する。
      FLIGHTDEAL_ARTIFACT_DIR: artifacts
      # Windows以外でも日本語を確実に扱う
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "--- installed ---"
          pip list

      # 依存が入っていても、版違い・依存漏れがあれば動かない。
      # ネットワークを使わずに、実行時と同じ経路（import〜クエリ組み立て）を通す。
      # 欠けている依存を1回で全部あぶり出すのが狙い。
      - name: Verify fast-flights API
        run: |
          python - <<'PY'
          import sys, traceback

          def fail(msg, e=None):
              print(f"NG: {msg}")
              if e is not None:
                  traceback.print_exc()
              sys.exit(1)

          try:
              import fast_flights
          except Exception as e:
              fail(f"import fast_flights に失敗: {type(e).__name__}: {e}", e)

          print("path:", getattr(fast_flights, "__file__", "?"))

          missing = [n for n in ("FlightQuery", "Passengers", "create_filter")
                     if not hasattr(fast_flights, n)]
          if missing:
              fail(f"期待するAPIがありません: {missing}\n"
                   "    古い 2.x が入っている可能性（2.x は FlightData を使う）。\n"
                   "    requirements.txt の fast-flights==3.0.2 を確認。")

          try:
              from fast_flights.parser import parse  # noqa: F401
              from fast_flights.exceptions import FlightsNotFound  # noqa: F401
          except Exception as e:
              fail(f"parser/exceptions の読み込みに失敗: {type(e).__name__}: {e}", e)

          # 実際にクエリを組み立てる（protobuf まで通す。外部接続はしない）
          try:
              from fast_flights import FlightQuery, Passengers, create_filter
              q = create_filter(
                  flights=[FlightQuery(date="2026-08-01", from_airport="HND",
                                       to_airport="HIJ", max_stops=0)],
                  trip="one-way", seat="economy",
                  passengers=Passengers(adults=1),
                  currency="JPY", language="ja",
              )
              params = q.params()
          except Exception as e:
              fail(f"クエリ組み立てに失敗: {type(e).__name__}: {e}", e)

          if "tfs" not in params:
              fail(f"tfs パラメータが生成されていません: {params}")

          print("OK: fast-flights 3.x を確認（クエリ組み立てまで成功）")
          PY

      # 要件6: 外部接続を伴わないテストのみをCIの合否条件にする
      - name: Unit tests
        run: pytest -q

      # Secrets 未登録のまま検索を走らせても最後に通知で失敗するだけなので、
      # 実行前に確認する。値そのものは絶対に出力しない（要件4.4）。
      - name: Check secrets
        if: ${{ inputs.dry_run != true }}
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: |
          missing=""
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            missing="$missing LINE_CHANNEL_ACCESS_TOKEN"
          fi
          if [ -z "$LINE_TO_USER_ID" ]; then
            missing="$missing LINE_TO_USER_ID"
          fi

          if [ -n "$missing" ]; then
            echo "NG: 未登録の Secrets:$missing"
            echo ""
            echo "登録場所: リポジトリの Settings > Secrets and variables > Actions"
            echo "          > New repository secret"
            echo "  ※ Environments / Codespaces ではなく Actions の Repository secrets"
            exit 1
          fi

          echo "OK: Secrets を確認しました（値は表示しません）"
          echo "  token  : ${#LINE_CHANNEL_ACCESS_TOKEN} 文字"
          echo "  userId : ${#LINE_TO_USER_ID} 文字 / 先頭 '${LINE_TO_USER_ID:0:1}'"
          echo ""
          echo "  参考: userId は 'U' で始まる 33 文字が正常です。"
          echo "        違う場合はチャネル基本設定の「あなたのユーザーID」を確認してください。"

      - name: Prepare artifact dir
        run: mkdir -p artifacts

      - name: Run
        id: run
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m flightdeal.main --dry-run
          else
            python -m flightdeal.main
          fi

      # 要件4.3: 失敗時は調査用の生HTMLを7日間保持する
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4  # v4系が現行
        with:
          name: debug-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
