name: daily-flight-check

# 要件4.1: JST 8:00 = UTC 23:00。GitHub Actions の cron は遅延を許容する仕様。
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "StubFetcher + コンソール通知で実行（外部接続なし）"
        type: boolean
        default: false

concurrency:
  group: daily-flight-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONPATH: src
      TZ: Asia/Tokyo
      # 障害調査用の生HTML保存先（要件4.3）。失敗時にアーティファクトとして回収する。
      FLIGHTDEAL_ARTIFACT_DIR: artifacts
      # Windows以外でも日本語を確実に扱う
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "--- installed ---"
          pip list

      # 依存が入っていても API が違えば動かない。原因を実行前に切り分ける。
      - name: Verify fast-flights API
        run: |
          python - <<'PY'
          import sys
          try:
              import fast_flights
          except Exception as e:
              print(f"NG: import fast_flights に失敗: {type(e).__name__}: {e}")
              sys.exit(1)

          print("path:", getattr(fast_flights, "__file__", "?"))
          missing = [n for n in ("FlightQuery", "Passengers", "create_filter")
                     if not hasattr(fast_flights, n)]
          if missing:
              print(f"NG: 期待するAPIがありません: {missing}")
              print("    古い 2.x が入っている可能性があります（2.x は FlightData を使う）。")
              print("    requirements.txt の fast-flights==3.0.2 を確認してください。")
              sys.exit(1)

          from fast_flights.parser import parse  # noqa: F401
          print("OK: fast-flights 3.x API を確認しました")
          PY

      # 要件6: 外部接続を伴わないテストのみをCIの合否条件にする
      - name: Unit tests
        run: pytest -q

      - name: Prepare artifact dir
        run: mkdir -p artifacts

      - name: Run
        id: run
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO_USER_ID: ${{ secrets.LINE_TO_USER_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m flightdeal.main --dry-run
          else
            python -m flightdeal.main
          fi

      # 要件4.3: 失敗時は調査用の生HTMLを7日間保持する
      - name: Upload debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4  # v4系が現行
        with:
          name: debug-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: ignore
